version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: edu_user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: edu_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'

  mongo:
    image: mongo:7.0
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

  backend:
    build:
      context: ../backend
    depends_on:
      - postgres
      - mongo
      - redis
    environment:
      - ENVIRONMENT=production
      - POSTGRES_URL=postgresql+asyncpg://edu_user:password@postgres:5432/edu_db
      - MONGODB_URL=mongodb://mongo:27017
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=supersecret
    expose:
      - '8000'

  frontend:
    build:
      context: ../frontend
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://nginx
    expose:
      - '3000'

  ai-service:
    build:
      context: ../ai-service
    depends_on:
      - backend
      - redis
    expose:
      - '8080'

  nginx:
    image: nginx:stable-alpine
    depends_on:
      - frontend
      - backend
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - '80:80'

volumes:
  postgres_data:
  mongo_data:
