version: '3.9'
services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - JWT_SECRET=${JWT_SECRET:-}
      - POSTGRES_URL=${POSTGRES_URL:-sqlite+aiosqlite:///./eduai.db}
      - REDIS_URL=${REDIS_URL:-redis://localhost:6379/0}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
