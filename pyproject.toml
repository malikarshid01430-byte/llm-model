[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-from-scratch"
version = "0.1.0"
description = "A fully manual GPT-style language model built from scratch with PyTorch"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.3.0",
  "numpy>=1.26.0",
  "pytest>=8.0.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "python-dotenv>=1.0.0",
  "requests>=2.32.0",
  "sentencepiece>=0.2.0",
  "accelerate>=0.33.0",
  "tensorboard>=2.17.0",
  "scikit-learn>=1.5.0",
  "nltk>=3.9.0",
  "transformers>=4.44.0",
  "regex>=2024.5.0",
  "pillow>=10.4.0",
  "python-docx>=1.2.0",
  "PyMuPDF>=1.24.0"
]

[tool.pytest.ini_options]
testpaths = ["tests", "tokenizer/tests", "training/tests", "embeddings/tests", "datasets/tests"]
